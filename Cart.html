<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="cart.css">
</head>
<body>
<div class="row">
  <div class="col-75">
        <div class="col-25">
  <div class="container">
    <!-- ID 'cart-count' allows JS to update the number next to the icon -->
    <h4>Cart <span class="price" style="color:black"><i class="fa fa-shopping-cart"></i> <b id="cart-count">0</b></span></h4>
    
    <hr>
    
    <!-- This ID is where the items will be injected -->
    <div id="cart-items-list">

        <p style="color: gray;">Your cart is empty</p>
    </div>
    
    <hr>
    
    <!-- ID 'cart-total' allows JS to update the price -->
    <p>Total <span class="price" style="color:black"><b id="cart-total">₹0</b></span></p>
  </div>
</div>

<!-- VERY IMPORTANT: Link your script before the closing body tag -->
<script src="script.js"></script>
      
        <div class="row">
          <div class="col-50">
            <h3>Billing Address</h3>
            <label for="fname"><i class="fa fa-user"></i> Full Name</label>
            <input type="text" id="fname" name="firstname" placeholder="John M. Doe">
            <label for="email"><i class="fa fa-envelope"></i> Email</label>
            <input type="text" id="email" name="email" placeholder="john@example.com">
            <label for="adr"><i class="fa fa-address-card-o"></i> Address</label>
            <input type="text" id="adr" name="address" placeholder="542 W. 15th Street">
            <label for="city"><i class="fa fa-institution"></i> City</label>
            <input type="text" id="city" name="city" placeholder="New York">

            <div class="row">
              <div class="col-50">
                <label for="state">State</label>
                <input type="text" id="state" name="state" placeholder="NY">
              </div>
              <div class="col-50">
                <label for="zip">Zip</label>
                <input type="text" id="zip" name="zip" placeholder="10001">
              </div>
            </div>
          </div>

          <div class="col-50">
            <h3>Payment</h3>
            <label for="fname">Accepted Cards</label>
            <div class="icon-container">
              <i class="fa fa-cc-visa" style="color:navy;"></i>
              <i class="fa-brands fa-apple-pay"></i>
              <i class="fa fa-cc-mastercard" style="color:red;"></i>
              <i class="fa fa-cc-discover" style="color:orange;"></i>
            </div>
            <label for="cname">Name of Card</label>
            <input type="text" id="cname" name="cardname" placeholder="John More Doe" required>
            <label for="ccnum">Credit card number</label>
            <input type="text" id="numericInput" maxlength="16"name="cardnumber" placeholder="1111-2222-3333-4444" required>
            <p id="errorMessage" style="color: red; display: none;">Error: Only Numbers Allowed </p>
            <label for="expmonth">Exp Month</label>
            <input type="text" id="text" name="expmonth" placeholder="September" required>
            <div class="row">
              <div class="col-50">
                <label for="expyear">Exp Year</label>
                <input type="text" id="numericInput1" maxlength="4" name="exp year" placeholder="2018" required>
            <p id="errorMessage1" style="color: red; display: none;">Error: Only Numbers Allowed </p>
              </div>
              <div class="col-50">
                <label for="cvv">CVV</label>
                <input type="text" id="numericInput2" maxlength="3"name="cvv" placeholder="352" required>
                <p id="errorMessage2" style="color: red; display: none;">Error: Only Numbers Allowed </p>
              </div>
            </div>
          </div>
          
        </div>
        <label>
          <input type="checkbox" checked="checked" name="sameadr"> Shipping address same as billing
          <input type="checkbox" checked="unchecked" name="Engrave">Engrave 
        </label>
        <input type="submit" value="Continue to checkout" class="btn">
      </form>
    </div>
  </div>
</div>
<script>
  const input = document.getElementById('numericInput');
const error = document.getElementById('errorMessage');

input.addEventListener('input', function(e) {
    // Remove any non-digit characters immediately
    const value = e.target.value;
    const cleanValue = value.replace(/\D/g, '');
    
    // Show error if user typed a non-digit
    if (value !== cleanValue) {
        error.style.display = 'block';
    } else {
        error.style.display = 'none';
    }
    
    // Update input with only numbers
    e.target.value = cleanValue;
});

</body>
</html>
